<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Multiview de un evento híbrido: programa, cámaras y entradas de Teams y Zoom">
  <!-- Marco del multiview -->
  <rect width="640" height="400" rx="22" fill="#111827"/>

  <!-- PROGRAMA (grande) -->
  <rect x="20" y="20" width="400" height="236" rx="8" fill="#1f2937" stroke="#ef4444" stroke-width="4"/>
  <!-- escenario: pantalla de fondo y ponente con atril -->
  <rect x="60" y="50" width="200" height="110" rx="4" fill="#374151"/>
  <circle cx="300" cy="140" r="22" fill="#9ca3af"/>
  <path d="M262 236 q38 -70 76 0 z" fill="#9ca3af"/>
  <rect x="270" y="190" width="60" height="46" rx="3" fill="#4b5563"/>
  <rect x="32" y="30" width="62" height="22" rx="4" fill="#ef4444"/>
  <text x="63" y="46" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">LIVE</text>
  <text x="404" y="244" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#fca5a5" text-anchor="end">PGM</text>

  <!-- CAM 2 -->
  <rect x="436" y="20" width="184" height="110" rx="8" fill="#1f2937" stroke="#22c55e" stroke-width="3"/>
  <circle cx="528" cy="66" r="16" fill="#6b7280"/>
  <path d="M500 130 q28 -50 56 0 z" fill="#6b7280"/>
  <text x="448" y="40" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#86efac">CAM 2</text>

  <!-- CAM 3: plano general del público -->
  <rect x="436" y="146" width="184" height="110" rx="8" fill="#1f2937" stroke="#4b5563" stroke-width="2"/>
  <g fill="#6b7280">
    <circle cx="470" cy="220" r="10"/><circle cx="505" cy="214" r="10"/><circle cx="540" cy="220" r="10"/><circle cx="575" cy="214" r="10"/>
    <circle cx="488" cy="244" r="11"/><circle cx="523" cy="240" r="11"/><circle cx="558" cy="244" r="11"/><circle cx="596" cy="240" r="11"/>
  </g>
  <text x="448" y="166" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#d1d5db">CAM 3</text>

  <!-- TEAMS: cuadrícula de participantes -->
  <rect x="20" y="272" width="294" height="108" rx="8" fill="#1f2937" stroke="#6366f1" stroke-width="2"/>
  <g fill="#312e81">
    <rect x="96" y="282" width="62" height="42" rx="4"/><rect x="164" y="282" width="62" height="42" rx="4"/><rect x="232" y="282" width="62" height="42" rx="4"/>
    <rect x="96" y="330" width="62" height="42" rx="4"/><rect x="164" y="330" width="62" height="42" rx="4"/><rect x="232" y="330" width="62" height="42" rx="4"/>
  </g>
  <g fill="#a5b4fc">
    <circle cx="127" cy="300" r="7"/><circle cx="195" cy="300" r="7"/><circle cx="263" cy="300" r="7"/>
    <circle cx="127" cy="348" r="7"/><circle cx="195" cy="348" r="7"/><circle cx="263" cy="348" r="7"/>
  </g>
  <text x="32" y="300" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#a5b4fc">TEAMS</text>

  <!-- ZOOM: ponente remoto -->
  <rect x="326" y="272" width="294" height="108" rx="8" fill="#1f2937" stroke="#3b82f6" stroke-width="2"/>
  <rect x="420" y="282" width="190" height="90" rx="4" fill="#1e3a8a"/>
  <circle cx="515" cy="318" r="16" fill="#93c5fd"/>
  <path d="M487 372 q28 -44 56 0 z" fill="#93c5fd"/>
  <text x="338" y="300" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#93c5fd">ZOOM</text>
</svg>
